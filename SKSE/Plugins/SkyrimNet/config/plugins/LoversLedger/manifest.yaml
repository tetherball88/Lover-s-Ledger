plugin:
  name: "LoversLedger"
  version: "1.0.3"
  description: "Lover's Ledger: per-NPC encounter history for SkyrimNet bios, plus first-time lines for SexLab scenes (TTLL_SexlabIntegration.GetFirstTimes)"
  icon: "💞"

schema:
  fields:
    - name: "Add virgin blood to first sexual encounter"
      path: "loversledger.first_time.virgin_blood"
      type: "bool"
      description: "On: the first time someone receives vaginal sex, their first-time line adds that their vagina is a little sore and bleeding. The first time someone receives anal sex, it adds the same for their asshole. Off: first-time lines only say it is the first time."
      defaultValue: false
      category: "First Time"
